<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>潮尚小车 - 智能控制中心</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Microsoft YaHei',sans-serif; }
    body{
      background:url('https://img.zcool.cn/community/016f2258f60d03a801219c771083e4.jpg') center center fixed,
                 linear-gradient(135deg, rgba(26,42,108,.8), rgba(44,62,80,.8), rgba(0,0,0,.9));
      background-blend-mode:overlay;
      background-size:cover;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:15px 20px;
      color:#fff;
      position:relative;
      overflow-x:hidden;
      touch-action:manipulation;
    }
    body::before{
      content:'';
      position:absolute; top:0; left:0; width:100%; height:100%;
      background: radial-gradient(circle at 20% 80%, rgba(79,195,247,.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(255,152,0,.1) 0%, transparent 50%);
      z-index:-1;
    }
    .login-card,.control-card{
      background:rgba(0,0,0,.85);
      border-radius:20px;
      box-shadow:0 8px 32px rgba(0,0,0,.3), 0 2px 8px rgba(79,195,247,.1);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.1);
      transition:transform .3s ease;
    }
    .login-card{ padding:30px 40px; width:100%; max-width:400px; text-align:center; margin-top:20px; }
    .login-card:hover{ transform:translateY(-5px); }
    .control-card{ padding:20px 30px; width:100%; max-width:800px; display:none; position:relative; margin-top:10px; }
    .control-card:hover{ transform:translateY(-3px); }
    .logo{
      font-size:1.8rem;
      margin:20px 0 15px 0;
      font-weight:700;
      background:linear-gradient(120deg,#4fc3f7,#ff9800,#ff5722);
      -webkit-background-clip:text; background-clip:text;
      color:transparent;
      text-shadow:0 2px 8px rgba(0,0,0,.2);
      letter-spacing:2px;
      position:relative;
      display:inline-block;
    }
    .logo::after{
      content:'';
      position:absolute;
      bottom:-5px;
      left:50%;
      transform:translateX(-50%);
      width:80%;
      height:2px;
      background:linear-gradient(90deg, transparent, #4fc3f7, #ff9800, transparent);
    }
    .login-title{
      font-size:1.5rem;
      margin-bottom:25px;
      color:#4fc3f7;
      text-shadow:0 0 10px rgba(79,195,247,.2);
    }
    .input-group{ margin-bottom:18px; text-align:left; }
    .input-group label{ display:block; margin-bottom:8px; font-size:1.1rem; color:#eee; }
    .input-group input{
      width:100%;
      padding:15px;
      border:1px solid rgba(79,195,247,.3);
      border-radius:10px;
      background:rgba(0,0,0,.4);
      color:#fff;
      font-size:1.1rem;
      outline:none;
      transition:all .3s ease;
    }
    .input-group input:focus{
      border-color:#4fc3f7;
      box-shadow:0 0 15px rgba(79,195,247,.2);
      background:rgba(0,0,0,.5);
    }
    .login-btn{
      background:linear-gradient(135deg,#4fc3f7,#2196f3);
      border:none;
      border-radius:10px;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
      transition:all .3s ease;
      box-shadow:0 4px 15px rgba(79,195,247,.2);
      width:100%;
      padding:15px;
      font-size:1.2rem;
      margin-top:10px;
    }
    .login-btn:hover{ transform:translateY(-3px); box-shadow:0 6px 20px rgba(79,195,247,.3); }
    .login-btn:active{ transform:translateY(1px); }
    .error-tip{ color:#ff6b6b; margin-top:15px; font-size:1rem; display:none; text-shadow:0 0 5px rgba(255,107,107,.2); }

    .video-container{
      background:rgba(0,0,0,.6);
      border-radius:15px;
      overflow:hidden;
      margin-bottom:15px;
      aspect-ratio:16/9;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(79,195,247,.2);
      position:relative;
      z-index:1;
      box-shadow:inset 0 0 10px rgba(0,0,0,.5);
    }
    #videoStream{ width:100%; height:100%; object-fit:cover; display:none; }
    .video-placeholder{ color:#ccc; font-size:1.2rem; text-align:center; padding:20px; }

    .func-switches{ display:flex; gap:15px; margin-bottom:15px; justify-content:center; flex-wrap:wrap; }

    /* ===== 氛围彩灯（WS2812）控制 ===== */
    .ambient-card{
      margin: 0 auto 15px auto;
      width:100%;
      max-width:800px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.08);
      border-radius:15px;
      padding:12px 12px 10px 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,.35);
    }
    .ambient-title{
      text-align:center;
      color:#4fc3f7;
      font-weight:800;
      letter-spacing:1px;
      margin:2px 0 10px 0;
      font-size:1.0rem;
      text-shadow:0 0 5px rgba(79,195,247,.2);
    }
    .ambient-row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }
    .amb-color{
      width:54px;
      height:40px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.25);
      padding:0;
      cursor:pointer;
    }
    .amb-field{
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      padding:10px 10px;
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:180px;
    }
    .amb-field label{
      font-size:.82rem;
      opacity:.85;
    }
    .amb-field select,
    .amb-field input[type="number"]{
      width:100%;
      padding:10px 10px;
      border:1px solid rgba(79,195,247,.25);
      border-radius:10px;
      background:rgba(0,0,0,.35);
      color:#fff;
      outline:none;
      font-size:.95rem;
    }
    .amb-actions{
      display:flex;
      gap:10px;
      width:100%;
    }
    .amb-actions .emoji-btn{
      flex:1;
      padding:10px 10px;
      font-size:.9rem;
    }
    .amb-hint{
      text-align:center;
      opacity:.75;
      font-size:.8rem;
      margin-top:10px;
      line-height:1.5;
    }
    .mini{
      font-size:.78rem;
      opacity:.8;
    }

    .toggle-switch{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
    .toggle-btn{
      width:40px; height:22px;
      background-color:rgba(68,68,68,.5);
      border-radius:11px;
      position:relative;
      transition:all .3s ease;
      border:1px solid rgba(255,255,255,.1);
    }
    .toggle-btn::after{
      content:'';
      width:18px; height:18px;
      background-color:#fff;
      border-radius:50%;
      position:absolute; top:1px; left:1px;
      transition:left .3s ease, transform .3s ease;
      box-shadow:0 2px 5px rgba(0,0,0,.2);
    }
    .toggle-switch.active .toggle-btn{ background-color:rgba(79,195,247,.5); }
    .toggle-switch.active .toggle-btn::after{ left:20px; transform:scale(1.05); }
    .toggle-label{ font-size:.9rem; color:#eee; }

    .control-panel{
      display:flex;
      gap:25px;
      margin-bottom:15px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .car-controls{ min-width:300px; }

    .cross-controls{
      display:grid;
      grid-template-areas:
        ". forward ."
        "left center right"
        ". backward .";
      grid-template-columns:90px 90px 90px;
      grid-template-rows:90px 90px 90px;
      gap:10px;
      margin:0 auto;
    }
    .control-btn{
      background:linear-gradient(135deg, rgba(79,195,247,.2), rgba(33,150,243,.05));
      border:1px solid rgba(79,195,247,.3);
      border-radius:50%;
      color:#fff;
      font-size:1.1rem;
      font-weight:bold;
      cursor:pointer;
      transition:all .3s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 5px 15px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
    }
    .control-btn:hover{
      background:linear-gradient(135deg, rgba(79,195,247,.3), rgba(33,150,243,.1));
      transform:scale(1.05);
      box-shadow:0 0 20px rgba(79,195,247,.2);
    }
    .control-btn:active{ transform:scale(.95); }
    .btn-forward{ grid-area:forward; }
    .btn-backward{ grid-area:backward; }
    .btn-left{ grid-area:left; }
    .btn-right{ grid-area:right; }
    .center-btns{
      grid-area:center;
      display:flex;
      flex-direction:column;
      gap:8px;
      height:100%;
    }
    .rotate-btn{
      background:linear-gradient(135deg, rgba(100,221,23,.3), rgba(100,221,23,.1));
      border:1px solid rgba(100,221,23,.5);
      border-radius:10px;
      color:#fff;
      font-size:.95rem;
      padding:8px;
      cursor:pointer;
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all .3s ease;
      box-shadow:0 3px 10px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.1);
    }
    .rotate-btn:hover{
      background:linear-gradient(135deg, rgba(100,221,23,.5), rgba(100,221,23,.2));
      box-shadow:0 0 15px rgba(100,221,23,.2);
    }

    .emoji-panel{
      min-width:300px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.08);
      border-radius:15px;
      padding:12px 12px 10px 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,.35);
    }
    .emoji-title{
      text-align:center;
      color:#ff9800;
      font-weight:700;
      letter-spacing:1px;
      margin:2px 0 10px 0;
      font-size:1.0rem;
      text-shadow:0 0 5px rgba(255,152,0,.2);
    }
    .emoji-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:10px;
    }
    .emoji-btn{
      border:none;
      cursor:pointer;
      border-radius:12px;
      padding:10px 8px;
      color:#fff;
      font-weight:700;
      font-size:.92rem;
      background:linear-gradient(135deg, rgba(255,152,0,.25), rgba(255,87,34,.08));
      border:1px solid rgba(255,152,0,.28);
      box-shadow:0 3px 10px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
      transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .emoji-btn:hover{
      transform:translateY(-2px);
      background:linear-gradient(135deg, rgba(255,152,0,.35), rgba(255,87,34,.12));
      box-shadow:0 0 15px rgba(255,152,0,.15);
    }
    .emoji-btn:active{ transform:translateY(1px); }
    .emoji-btn.small{ font-size:.85rem; padding:9px 8px; }
    .emoji-hint{
      text-align:center;
      opacity:.75;
      font-size:.8rem;
      margin-top:10px;
    }

    .servo-wrap{
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed rgba(255,255,255,.12);
    }
    .servo-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:.9rem;
      color:#4fc3f7;
      font-weight:700;
      margin-bottom:8px;
    }
    .servo-toggle{
      font-size:.78rem;
      opacity:.85;
      cursor:pointer;
      user-select:none;
      padding:4px 8px;
      border-radius:8px;
      border:1px solid rgba(79,195,247,.25);
      background:rgba(79,195,247,.08);
    }
    .servo-panel{ display:none; }
    .servo-panel.show{ display:block; }

    .servo-row{
      margin:10px 0;
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:10px 10px;
    }
    .servo-row .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:.85rem;
      opacity:.92;
      margin-bottom:6px;
    }
    .servo-val{
      color:#ff9800;
      font-weight:800;
    }
    input[type="range"]{
      width:100%;
      accent-color:#4fc3f7;
    }
    .servo-actions{
      display:flex;
      gap:8px;
      margin-top:8px;
    }
    .servo-actions .emoji-btn{
      flex:1;
      padding:9px 8px;
      font-size:.85rem;
    }

    .status-tip{
      background:rgba(0,0,0,.7);
      border-radius:8px;
      padding:8px 15px;
      font-size:.9rem;
      border-left:3px solid transparent;
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      z-index:999;
      opacity:0;
      transition:all .3s ease;
      min-width:200px;
      text-align:center;
      box-shadow:0 3px 10px rgba(0,0,0,.2);
      border:1px solid rgba(255,255,255,.1);
    }
    .status-tip.success{ border-left-color:#4CAF50; color:#fff; background:rgba(76,175,80,.2); }
    .status-tip.error{ border-left-color:#ff6b6b; color:#fff; background:rgba(255,107,107,.2); }
    .status-tip.show{ opacity:1; transform:translateX(-50%) translateY(-5px); }

    .logout-btn{
      position:absolute;
      top:15px;
      right:15px;
      padding:8px 15px;
      background:linear-gradient(135deg,#ff6b6b,#e55555);
      border:none;
      border-radius:8px;
      color:#fff;
      cursor:pointer;
      transition:all .3s ease;
      z-index:2;
      font-size:.9rem;
      box-shadow:0 3px 10px rgba(255,107,107,.2);
    }
    .logout-btn:hover{ box-shadow:0 0 10px rgba(255,107,107,.3); transform:translateY(-2px); }

    @media (max-width: 480px) {
      .login-card,.control-card{ padding:15px 20px; margin:10px 0; }
      .logo{ font-size:1.5rem; margin:20px 0 15px 0; }
      .cross-controls{
        grid-template-columns:70px 70px 70px;
        grid-template-rows:70px 70px 70px;
        gap:8px;
      }
      .control-btn{ font-size:.9rem; }
      .rotate-btn{ font-size:.8rem; padding:6px; }
      .logout-btn{ top:10px; right:10px; padding:6px 10px; font-size:.8rem; }
      .video-container{ margin-bottom:10px; aspect-ratio:4/3; }
      .video-placeholder{ font-size:1rem; padding:15px; }
      .control-panel{ flex-direction:column; gap:15px; }
      .emoji-grid{ gap:8px; }
      .emoji-btn{ font-size:.9rem; padding:10px 6px; }
      .emoji-btn.small{ font-size:.82rem; padding:9px 6px; }
      .status-tip{ bottom:15px; padding:6px 12px; font-size:.8rem; min-width:150px; }
    }
  
    /* ===== 功能模块（放在方向控制下面） ===== */
    .module-wrap{
      margin:14px 0 0 0;      /* 不居中占位，直接跟随布局 */
      width:100%;
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      padding:12px 12px 10px 12px;
      box-shadow: inset 0 0 12px rgba(0,0,0,.35);
    }
    .module-title{
      text-align:center;
      color:#4fc3f7;
      font-weight:900;
      letter-spacing:1px;
      margin:2px 0 10px 0;
      font-size:1.02rem;
      text-shadow:0 0 6px rgba(79,195,247,.18);
    }
    .section-wrap{
      margin-top:10px;
      padding-top:10px;
      border-top:1px dashed rgba(255,255,255,.10);
    }
    .section-panel{ display:none; }
    .section-panel.show{ display:block; }

    /* 五彩按钮更像“功能”而不是表情 */
    .emoji-btn.alt{
      background:linear-gradient(135deg, rgba(255,152,0,.18), rgba(255,87,34,.06));
      border:1px solid rgba(255,152,0,.22);
    }


    /* ===== 语音对讲/监听（网页对讲） ===== */
    .voice-row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }
    .ptt-btn{
      background:linear-gradient(135deg, rgba(100,221,23,.35), rgba(100,221,23,.12));
      border:1px solid rgba(100,221,23,.55);
      border-radius:12px;
      color:#fff;
      font-weight:900;
      cursor:pointer;
      padding:12px 14px;
      min-width:160px;
      box-shadow:0 3px 10px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
      transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
      user-select:none;
      -webkit-user-select:none;
      touch-action:manipulation;
    }
    .ptt-btn:hover{ transform:translateY(-2px); box-shadow:0 0 14px rgba(100,221,23,.18); }
    .ptt-btn:active, .ptt-btn.active{
      transform:translateY(1px) scale(.98);
      filter:saturate(1.15);
      box-shadow:0 0 18px rgba(100,221,23,.25);
    }
    .voice-status{
      text-align:center;
      opacity:.82;
      font-size:.85rem;
      margin-top:10px;
      line-height:1.5;
    }
    .voice-pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.25);
      margin:0 4px;
      font-size:.82rem;
    }

</style>
</head>

<body>
  <div class="login-card" id="loginPanel" style="display: none;">
    <div class="logo">潮尚小车</div>

      <input type="password" id="password" placeholder="请输入登录密码">

<button class="emoji-btn" onclick="setEmoji(&#39;happy&#39;)">😀 开心</button>

    // ===== 氛围彩灯（WS2812）控制 =====
    function hexToRgb(hex) {
      const h = (hex || '').replace('#','').trim();
      if (h.length !== 6) return {r:0,g:0,b:0};
      const num = parseInt(h, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function scaleRgb(rgb, bri) {
      const k = Math.max(0, Math.min(255, bri)) / 255.0;
      return {
        r: Math.round(rgb.r * k),
        g: Math.round(rgb.g * k),
        b: Math.round(rgb.b * k),
      };
    }

    function syncAmbientUI() {
      const bri = document.getElementById('ambBri');
      const briVal = document.getElementById('ambBriVal');
      if (bri && briVal) briVal.textContent = bri.value;

      const mode = document.getElementById('ambMode');
      const lab = document.getElementById('ambParamLabel');
      const param = document.getElementById('ambParam');
      if (mode && lab && param) {
        if (mode.value === 'solid') {
          lab.textContent = '参数（无）';
          param.disabled = true;
          param.style.opacity = 0.6;
        } else if (mode.value === 'flash') {
          lab.textContent = '点亮时长 onMs';
          param.disabled = false;
          param.style.opacity = 1;
          if (!param.value) param.value = 150;
        } else if (mode.value === 'breath') {
          lab.textContent = '周期 periodMs';
          param.disabled = false;
          param.style.opacity = 1;
          if (!param.value) param.value = 1600;
        }
      }
    }

      const mode = document.getElementById('ambMode').value;
      const param = parseInt(document.getElementById('ambParam').value || '0', 10);

      const rgb = scaleRgb(hexToRgb(colorHex), bri);

      if (mode === 'solid') {
        sendCmd(`led:${rgb.r},${rgb.g},${rgb.b}`);
      } else if (mode === 'flash') {
        const onMs = Math.max(20, Math.min(5000, param || 150));
        sendCmd(`led:flash,${rgb.r},${rgb.g},${rgb.b},${onMs}`);
      } else if (mode === 'breath') {
        const period = Math.max(200, Math.min(20000, param || 1600));
        sendCmd(`led:breath,${rgb.r},${rgb.g},${rgb.b},${period}`);
      } else {
        sendCmd(`led:${rgb.r},${rgb.g},${rgb.b}`);
      }

    // ===== 五彩快/慢闪（网页端定时发送 led:flash 指令）=====
    let _rainbowTimer = null;
    let _rainbowIdx = 0;

    function stopRainbow(turnOff=false){
      if (_rainbowTimer) { clearInterval(_rainbowTimer); _rainbowTimer = null; }
      _rainbowIdx = 0;
      if (turnOff) sendCmd('led:off');
    }

    function rainbowBlink(speed){
      stopRainbow(false);

      // 避免和“闪光灯”按钮的状态冲突（这里只管 WS2812）
      const flashToggle = document.getElementById('flashToggle');
      if (flashToggle) flashToggle.classList.remove('active');

      const colors = [
        {r:255,g:0,b:0},
        {r:255,g:128,b:0},
        {r:255,g:255,b:0},
        {r:0,g:255,b:0},
        {r:0,g:96,b:255},
      ];
      const fast = (speed === 'fast');
      const interval = fast ? 240 : 850;
      const onMs = fast ? 120 : 260;

      _rainbowTimer = setInterval(() => {
        const c = colors[_rainbowIdx % colors.length];
        _rainbowIdx++;
        sendCmd(`led:flash,${c.r},${c.g},${c.b},${onMs}`);

      showStatusTip(fast ? '五彩快闪已开启' : '五彩慢闪已开启', 'success');
    }



    // ===== 语音对讲/监听（云转发 /audio WebSocket，PCM16@16kHz）=====
    let wsAudio = null;
    let wsAudioOk = false;

    let audioCtx = null;
    let gainNode = null;
    let nextPlayTime = 0;

    let micStream = null;
    let micSrc = null;
    let micProc = null;

    let listening = false;
    let talking = false;
    let wasListeningBeforeTalk = false;

    const TARGET_SR = 16000;
    const FRAME_SAMPLES = 320; // 20ms @16k
    const FRAME_BYTES = FRAME_SAMPLES * 2;

    // 简单的下采样 + 打包为 20ms 帧
    let _pcmCarry = new Int16Array(0);

    function _wsBaseFromHttp(httpBase){
      try{
        const u = new URL(httpBase);
        u.protocol = (u.protocol === 'https:') ? 'wss:' : 'ws:';
        return u.origin;
      }catch(e){
        // 兜底：把 http/https 替换成 ws/wss
        return (httpBase || '').replace(/^https:/,'wss:').replace(/^http:/,'ws:');
      }
    }

    function _setVoiceStatus(txt){
      const el = document.getElementById('voiceStatusText');
      if (!el) return;
      el.innerHTML = `<span class="voice-pill">${txt}</span><span class="voice-pill">模式：半双工</span>`;
    }

    function toggleVoiceSec(){
      const p = document.getElementById('voiceSec');
      if (!p) return;

    function initVoiceUI(){
      const ptt = document.getElementById('pttBtn');
      const vol = document.getElementById('voiceVol');
      const volVal = document.getElementById('voiceVolVal');

      if (vol && volVal){
        vol.addEventListener('input', ()=>{
          volVal.textContent = vol.value;
          if (gainNode) gainNode.gain.value = Math.max(0, Math.min(1, vol.value/100));
        });
      }

      if (!ptt) return;

      const start = async ()=>{
        // 半双工：按住说话时自动暂停监听，避免回声/啸叫
        wasListeningBeforeTalk = listening;
        if (listening){
          listening = false;
          const lb = document.getElementById('listenBtn');
          if (lb) lb.classList.remove('active');
          sendCmd('mic_stream_off');
        }
        talking = true;
        ptt.classList.add('active');
        _setVoiceStatus('音频：对讲中…');
        try{
          await startTalk();
        }catch(e){
          talking = false;
          ptt.classList.remove('active');
          _setVoiceStatus('音频：未连接');
          showStatusTip(`麦克风不可用：${e.message || e}`, 'error');
        }
      };

      const stop = ()=>{
        if (!talking) return;
        talking = false;
        ptt.classList.remove('active');
        stopTalk();
        // 若之前在监听，松开后自动恢复监听
        if (wasListeningBeforeTalk){
          wasListeningBeforeTalk = false;
          toggleListen(true); // force on
        }else{
          _setVoiceStatus(wsAudioOk ? '音频：已连接' : '音频：未连接');
        }
      };

      ptt.addEventListener('mousedown', start);
      ptt.addEventListener('mouseup', stop);
      ptt.addEventListener('mouseleave', stop);

      ptt.addEventListener('touchstart', (e)=>{ e.preventDefault(); start(); }, {passive:false});
      ptt.addEventListener('touchend', stop);
      ptt.addEventListener('touchcancel', stop);
    }

    async function ensureAudioCtx(){
      if (audioCtx) return audioCtx;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      const vol = document.getElementById('voiceVol');
      const v = vol ? parseInt(vol.value||'80',10) : 80;
      gainNode.gain.value = Math.max(0, Math.min(1, v/100));
      gainNode.connect(audioCtx.destination);
      nextPlayTime = audioCtx.currentTime + 0.05;
      return audioCtx;
    }

    async function ensureAudioWs(){
      if (wsAudio && (wsAudio.readyState === 0 || wsAudio.readyState === 1)) return;

      const base = _wsBaseFromHttp(CONFIG.SERVER);
      const url = `${base}/audio?device=${encodeURIComponent(CONFIG.DEVICE_ID)}`;

      wsAudioOk = false;
      _setVoiceStatus('音频：连接中…');

      wsAudio = new WebSocket(url);
      wsAudio.binaryType = 'arraybuffer';

      wsAudio.onopen = ()=>{
        wsAudioOk = true;
        _setVoiceStatus(listening ? '音频：监听中' : '音频：已连接');
        showStatusTip('音频通道已连接', 'success');
      };
      wsAudio.onclose = ()=>{
        wsAudioOk = false;
        _setVoiceStatus('音频：未连接');
      };
      wsAudio.onerror = ()=>{
        wsAudioOk = false;
        _setVoiceStatus('音频：未连接');
      };

      wsAudio.onmessage = async (ev)=>{
        // 收到车麦 PCM16(16k) -> 播放
        if (!(ev.data instanceof ArrayBuffer)) return;
        await playPcm16(ev.data);
      };
    }

    function _downsampleTo16k(float32, inSr){
      if (inSr === TARGET_SR){
        const out = new Int16Array(float32.length);
        for (let i=0;i<float32.length;i++){
          let s = Math.max(-1, Math.min(1, float32[i]));
          out[i] = (s < 0) ? s*0x8000 : s*0x7fff;
        }
        return out;
      }
      const ratio = inSr / TARGET_SR;
      const outLen = Math.floor(float32.length / ratio);
      const out = new Int16Array(outLen);
      let o = 0;
      let i = 0;
      while (o < outLen){
        const idx = Math.floor(i);
        const idx2 = Math.min(idx+1, float32.length-1);
        const frac = i - idx;
        const s = float32[idx]*(1-frac) + float32[idx2]*frac;
        let v = Math.max(-1, Math.min(1, s));
        out[o++] = (v < 0) ? v*0x8000 : v*0x7fff;
        i += ratio;
      }
      return out;
    }

    function _appendAndChunk(int16){
      // 拼接 carry + 新数据，再按 20ms(320 samples) 切帧
      const merged = new Int16Array(_pcmCarry.length + int16.length);
      merged.set(_pcmCarry, 0);
      merged.set(int16, _pcmCarry.length);

      const frames = [];
      let offset = 0;
      while (merged.length - offset >= FRAME_SAMPLES){
        frames.push(merged.slice(offset, offset + FRAME_SAMPLES));
        offset += FRAME_SAMPLES;
      }
      _pcmCarry = merged.slice(offset);
      return frames;
    }

    async function startTalk(){
      await ensureAudioWs();
      await ensureAudioCtx();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      if (micStream) return; // 已在采集

      micStream = await navigator.mediaDevices.getUserMedia({
        audio:{
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      micSrc = audioCtx.createMediaStreamSource(micStream);
      // ScriptProcessor 兼容性好；如需更稳，可升级 AudioWorklet
      micProc = audioCtx.createScriptProcessor(4096, 1, 1);
      micProc.onaudioprocess = (e)=>{
        if (!talking || !wsAudioOk || !wsAudio || wsAudio.readyState !== 1) return;
        const input = e.inputBuffer.getChannelData(0);
        const pcm16 = _downsampleTo16k(input, audioCtx.sampleRate);
        const frames = _appendAndChunk(pcm16);
        for (const fr of frames){
          // 发送原始 PCM16LE
          wsAudio.send(fr.buffer);
        }
      };

      micSrc.connect(micProc);
      // 不需要把自己声音回放到扬声器：不连接到 destination
      micProc.connect(audioCtx.destination);
    }

    function stopTalk(){
      try{
        if (micProc){
          micProc.disconnect();
          micProc.onaudioprocess = null;
        }
      }catch(_){}
      try{ if (micSrc) micSrc.disconnect(); }catch(_){}
      micProc = null;
      micSrc = null;

      if (micStream){
        try{ micStream.getTracks().forEach(t=>t.stop()); }catch(_){}
      }
      micStream = null;
      _pcmCarry = new Int16Array(0);
    }

    async function playPcm16(arrayBuf){
      await ensureAudioCtx();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      const pcm = new Int16Array(arrayBuf);
      // Int16 -> Float32
      const f = new Float32Array(pcm.length);
      for (let i=0;i<pcm.length;i++) f[i] = pcm[i] / 32768.0;

      const buf = audioCtx.createBuffer(1, f.length, TARGET_SR);
      buf.copyToChannel(f, 0, 0);

      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(gainNode);

      const now = audioCtx.currentTime;
      if (nextPlayTime < now) nextPlayTime = now + 0.02;
      src.start(nextPlayTime);
      nextPlayTime += buf.duration;
    }

    function toggleListen(forceOn=null){
      const lb = document.getElementById('listenBtn');
      const turnOn = (forceOn === null) ? !listening : !!forceOn;

      ensureAudioWs();

      if (turnOn){
        listening = true;
        if (lb) lb.classList.add('active');
        sendCmd('mic_stream_on');
        _setVoiceStatus('音频：监听中');
        showStatusTip('已开启监听车麦', 'success');
      }else{
        listening = false;
        if (lb) lb.classList.remove('active');
        sendCmd('mic_stream_off');
        _setVoiceStatus(wsAudioOk ? '音频：已连接' : '音频：未连接');
        showStatusTip('已关闭监听车麦', 'success');
      }
    }

    function voiceCleanupOnLogout(){
      try{
        listening = false;
        talking = false;
        wasListeningBeforeTalk = false;
        stopTalk();
        const lb = document.getElementById('listenBtn');
        const ptt = document.getElementById('pttBtn');
        if (lb) lb.classList.remove('active');
        if (ptt) ptt.classList.remove('active');
        sendCmd('mic_stream_off');
      }catch(_){}

      try{ if (wsAudio) wsAudio.close(); }catch(_){}
      wsAudio = null;
      wsAudioOk = false;
      _setVoiceStatus('音频：未连接');
    }


</script>
